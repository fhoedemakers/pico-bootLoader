name: Build and create a release when tag is pushed

# Only deploy when a new tag is pushed
# git tag v0.n
# git push origin v0.n
on:
    push:
        tags:
          - "v*.*-alpha"
          - "v*.*.*"
          - "v*.*"
    workflow_dispatch:

# Must match the project() name in CMakeLists.txt
env:
    APP_NAME: pico-bootLoader

# Allow this workflow to write back to the repository
permissions:
    contents: write

jobs:
    build-release:
        runs-on: self-hosted
        name: Build loader + emulators and create release
        steps:

          - name: Check out this repository with submodules
            uses: actions/checkout@v6
            with:
                submodules: recursive

          - name: Update line containing pico_set_program_version() in CMakeLists.txt with tag name
            run: |
                 input_string=${{ github.ref }}
                 prefix="refs/tags/"
                 if [[ $input_string == $prefix* ]]; then
                      echo "The string starts with 'refs/tags/'."
                      tag="${input_string#$prefix}"
                      echo "Tag is ${tag}"
                      sed -i "s/^[[:space:]]*pico_set_program_version(.*/pico_set_program_version(${{ env.APP_NAME }} \"$tag\")/" CMakeLists.txt
                      sed -i "s/VX.X/$tag/" pico_shared/menu.h
                 else
                      echo "The string does not start with 'refs/tags/'."
                 fi
                 grep "pico_set_program_version" CMakeLists.txt
                 grep SWVERSION pico_shared/menu.h

          - name: Build bootLoader for every RP2350 hardware configuration
            run: |
                 chmod +x build*.sh bld.sh pico_shared/bld.sh
                 export PICO_SDK_PATH=/datalocal/pico/pico-sdk
                 export PICO_PIO_USB_PATH=/datalocal/Pico-PIO-USB
                 ./buildAll.sh

          - name: Clone and build the emulators (latest tag)
            run: |
                 export PICO_SDK_PATH=/datalocal/pico/pico-sdk
                 export PICO_PIO_USB_PATH=/datalocal/Pico-PIO-USB
                 rm -rf emu-build
                 mkdir emu-build
                 # prog_name from emulators.txt -> github repo name
                 EMULATORS=(
                     "piconesPlus=pico-infonesPlus"
                     "picogenesisPlus=pico-genesisPlus"
                     "picopcePlus=pico-pcePlus"
                     "PicoPeanutGB=pico-peanutGB"
                     "picosmsPlus=pico-smsplus"
                 )
                 for entry in "${EMULATORS[@]}"; do
                     repo="${entry##*=}"
                     url="https://github.com/fhoedemakers/$repo.git"
                     # Determine the latest version tag from the remote
                     tag=$(git ls-remote --tags --refs --sort=-v:refname "$url" \
                         | head -n1 | sed 's#.*refs/tags/##')
                     if [ -z "$tag" ]; then
                         echo "No tags found for $repo" >&2
                         exit 1
                     fi
                     echo "=============================="
                     echo "Building $repo (tag $tag)"
                     echo "=============================="
                     git clone --branch "$tag" --recurse-submodules --depth 1 \
                         "$url" "emu-build/$repo"
                     (
                         cd "emu-build/$repo"
                         chmod +x build*.sh bld.sh pico_shared/bld.sh
                         ./buildAll.sh
                     )
                 done
                 # fruitjam-doom (Doom!) — Adafruit Fruit Jam only (HW_CONFIG 8).
                 # No release tags, so build the branch. It vendors its own
                 # pico-sdk/pico-extras as submodules (hence --recurse-submodules)
                 # and uses a bespoke script that also emits the DATA-family WAD
                 # UF2. pack_release.sh picks the outputs up from
                 # emu-build/fruitjam-doom/build_bl_fruitjam/src/.
                 DOOM_REPO=fruitjam-doom
                 DOOM_BRANCH=adafruit-fruitjam
                 echo "=============================="
                 echo "Building $DOOM_REPO (branch $DOOM_BRANCH)"
                 echo "=============================="
                 git clone --branch "$DOOM_BRANCH" --recurse-submodules --depth 1 \
                     "https://github.com/fhoedemakers/$DOOM_REPO.git" "emu-build/$DOOM_REPO"
                 (
                     cd "emu-build/$DOOM_REPO"
                     chmod +x fruitjam-build-forbootloader.sh
                     ./fruitjam-build-forbootloader.sh
                 )

          - name: Assemble SD-card release zip
            run: |
                 chmod +x .github/scripts/pack_release.sh
                 rm -rf release-zip
                 mkdir release-zip
                 ./.github/scripts/pack_release.sh release-zip emu-build .
                 (cd release-zip && zip -r ../releases/pico-bootLoader_sdcard.zip emu)

          - name: List release artifacts
            run: |
                 ls -l releases/

          - name: Create release
            uses: softprops/action-gh-release@v3
            if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
            with:
              files: |
                releases/pico-bootLoader_*.uf2
                releases/pico-bootLoader_sdcard.zip
